<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Volume Master Pro</title>
<style>
  :root {
    --bg-main: #0b1329;
    --bg-card: #131f3a;
    --bg-hover: #1e2c4f;
    --primary: #3b82f6;
    --primary-glow: rgba(59, 130, 246, 0.4);
    --accent: #60a5fa;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    width: 340px;
    background: var(--bg-main);
    color: var(--text-main);
    user-select: none;
  }

  /* App Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand img {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    box-shadow: 0 0 10px var(--primary-glow);
  }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: var(--text-main);
  }
  .save-option {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .save-option input { cursor: pointer; accent-color: var(--primary); }

  /* Tab List */
  .tab-list-header {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .tab-list {
    max-height: 125px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
    padding-right: 2px;
  }
  .tab-list::-webkit-scrollbar {
    width: 4px;
  }
  .tab-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
  }
  .tab-item {
    display: flex;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s ease;
    gap: 8px;
  }
  .tab-item:hover {
    background: var(--bg-hover);
    border-color: rgba(59, 130, 246, 0.3);
  }
  .tab-item.selected {
    border-color: var(--primary);
    background: linear-gradient(90deg, rgba(59, 130, 246, 0.18), rgba(59, 130, 246, 0.05));
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
  }
  .tab-fav {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    object-fit: contain;
  }
  .tab-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    color: #cbd5e1;
  }
  .tab-item.selected .tab-title {
    color: #fff;
  }
  .tab-vol {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
  }
  .tab-vol.boosted {
    color: var(--accent);
  }

  /* Main Volume Display */
  .volume-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 14px;
    text-align: center;
    margin-bottom: 12px;
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .volume-value {
    font-size: 38px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 6px;
    text-shadow: 0 0 20px var(--primary-glow);
  }
  .volume-status {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.3px;
    margin-bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(59, 130, 246, 0.12);
  }

  /* Custom Range Slider */
  .slider-container {
    padding: 0 4px;
    margin-bottom: 14px;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    background: #1e293b;
    border-radius: 4px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--primary);
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  /* Presets Bar */
  .presets {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .preset-btn {
    flex: 1;
    padding: 6px 0;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .preset-btn:hover {
    background: var(--bg-hover);
    color: #fff;
  }
  .preset-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 8px var(--primary-glow);
  }

  /* Buttons Grid */
  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .btn {
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: var(--bg-hover);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .btn.danger {
    color: #f87171;
  }
  .btn.danger:hover {
    background: rgba(248, 113, 113, 0.15);
    border-color: rgba(248, 113, 113, 0.3);
  }

  /* Settings Accordion */
  .accordion-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 0;
    margin-top: 4px;
    border-top: 1px solid var(--border);
  }
  .accordion-toggle:hover { color: #fff; }

  .eq-panel {
    display: none;
    padding: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 6px;
  }
  .eq-panel.open { display: block; }
  .eq-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 8px;
  }
  .eq-row label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }
  .eq-select {
    width: 100%;
    padding: 4px 6px;
    font-size: 11px;
    background: var(--bg-main);
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    outline: none;
  }

  /* Footer Hint */
  .footer-hint {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 8px;
    line-height: 1.3;
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="icon48.png" alt="Logo">
    <h1>Volume Master Pro</h1>
  </div>
  <label class="save-option" title="Persist tab volume across browser sessions">
    <input type="checkbox" id="autosave" checked> Auto-save
  </label>
</div>

<div class="tab-list-header">Active Tabs</div>
<div id="tabList" class="tab-list"></div>

<div class="volume-card">
  <div class="volume-value" id="valueDisplay">100%</div>
  <div class="volume-status" id="statusBadge">✦ Studio Limiter Active</div>

  <div class="slider-container">
    <input type="range" min="0" max="600" value="100" id="volumeSlider">
  </div>

  <div class="presets">
    <button class="preset-btn active" data-vol="100">100%</button>
    <button class="preset-btn" data-vol="200">200%</button>
    <button class="preset-btn" data-vol="300">300%</button>
    <button class="preset-btn" data-vol="400">400%</button>
    <button class="preset-btn" data-vol="600">600%</button>
  </div>

  <div class="controls-grid">
    <button class="btn" id="decBtn">-10%</button>
    <button class="btn" id="incBtn">+10%</button>
    <button class="btn danger" id="muteBtn">Mute</button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>
  <button class="btn" id="noiseBtn" style="width:100%;margin-top:6px;background:rgba(59,130,246,0.18);border-color:rgba(59,130,246,0.4);color:#60a5fa;font-weight:700;" title="Suppress background hiss/hum while keeping speech crisp and clear">⚡ Noise Suppressor: ON</button>

</div>

<div class="accordion-toggle" id="eqToggle">
  <span>Equalizer & Fine Tuning</span>
  <span id="eqArrow">▼</span>
</div>

<div class="eq-panel" id="eqPanel">
  <div class="eq-row">
    <label>Filter Mode</label>
    <select id="eqAlgo" class="eq-select">
      <option value="peaking" selected>Peaking (Parametric)</option>
      <option value="lowshelf">Lowshelf (Bass Boost)</option>
      <option value="highshelf">Highshelf (Treble Boost)</option>
      <option value="lowpass">Lowpass (Treble Cut)</option>
      <option value="highpass">Highpass (Sub-bass Cut)</option>
    </select>
  </div>

  <div class="eq-row">
    <label>Frequency <span id="eqFreqVal">1000 Hz</span></label>
    <input type="range" id="eqFreq" min="50" max="12000" value="1000" step="50">
  </div>

  <div class="eq-row">
    <label>Quality Factor (Q) <span id="eqQVal">1.0</span></label>
    <input type="range" id="eqQ" min="0.1" max="10" value="1.0" step="0.1">
  </div>

  <div class="eq-row">
    <label>EQ Gain <span id="eqGainVal">0 dB</span></label>
    <input type="range" id="eqGain" min="-18" max="18" value="0" step="0.5">
  </div>
</div>

<div class="footer-hint">
  Clean peak-limited amplification up to 600%. Compatible with Chrome & Brave.
</div>

<script src="popup.js"></script>
</body>
</html>
